<style>
:root{
  --primary:#2563eb; --secondary:#7c3aed; --accent:#06b6d4;
  --text:#0f172a; --text-light:#5b6472; --bg:#ffffff; --bg-alt:#f6f8fc;
  --card:#ffffff; --border:#e5e9f2; --shadow:0 10px 30px rgba(15,23,42,.08);
  --nav-bg:rgba(255,255,255,.8); --font:'Poppins',system-ui,sans-serif;
}
[data-theme="dark"]{
  --text:#f1f5f9; --text-light:#aab4c4; --bg:#0b1120; --bg-alt:#111a2e;
  --card:#141f36; --border:#24314d; --shadow:0 10px 30px rgba(0,0,0,.4);
  --nav-bg:rgba(11,17,32,.8);
}
[dir="rtl"]{--font:'Cairo',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.container{width:min(1100px,92%);margin:0 auto}
section{padding:90px 0}

/* Scroll progress */
#progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));z-index:200}

/* Nav */
header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;background:linear-gradient(90deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.gm-mark{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 3px 8px rgba(124,58,237,.35))}
footer .gm-mark{width:44px;height:44px;margin:0 auto 12px}
.nav-links{display:flex;gap:26px;list-style:none;align-items:center}
.nav-links a{font-size:.9rem;font-weight:500;color:var(--text-light);transition:color .2s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--primary)}
.nav-actions{display:flex;gap:10px}
.icon-btn{background:none;border:1px solid var(--border);border-radius:10px;min-width:38px;height:38px;padding:0 10px;display:grid;place-items:center;cursor:pointer;color:var(--text-light);font-family:var(--font);font-size:.8rem;font-weight:700;transition:.2s}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px}
.hamburger{display:none}
.sun-icon{display:none}
[data-theme="dark"] .sun-icon{display:block}
[data-theme="dark"] .moon-icon{display:none}

/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;padding:120px 0 80px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0}
.hero::before{width:420px;height:420px;background:var(--primary);top:-120px;inset-inline-end:-100px}
.hero::after{width:380px;height:380px;background:var(--accent);bottom:-140px;inset-inline-start:-120px}
#particles{position:absolute;inset:0;z-index:0;pointer-events:none}
#glow{position:fixed;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.13),rgba(6,182,212,.07) 45%,transparent 65%);pointer-events:none;z-index:1;transform:translate(-50%,-50%);left:-999px;top:-999px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;position:relative;z-index:1}
.hero-badge{display:inline-block;padding:7px 16px;border-radius:999px;background:linear-gradient(90deg,rgba(37,99,235,.12),rgba(124,58,237,.12));border:1px solid rgba(37,99,235,.25);color:var(--primary);font-size:.82rem;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;line-height:1.15;margin-bottom:10px}
.hero h1 span{background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-role{font-size:clamp(1rem,2.4vw,1.35rem);font-weight:600;min-height:1.8em;margin-bottom:14px}
.hero-role .typed{color:var(--primary)}
.hero-role .cursor{display:inline-block;color:var(--primary);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hero p.bio{color:var(--text-light);max-width:520px;margin-bottom:26px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:12px;font-weight:600;font-size:.95rem;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s,color .25s;border:1px solid transparent;cursor:pointer;will-change:transform}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 8px 24px rgba(37,99,235,.35)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(37,99,235,.45)}
.btn-outline{border-color:var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
.hero-photo{position:relative;justify-self:center;transform-style:preserve-3d;will-change:transform;transition:transform .2s ease-out}
.hero-photo .ring{position:absolute;inset:-11px;border-radius:50%;background:conic-gradient(from 0deg,var(--primary),var(--accent),var(--primary));animation:spin 8s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-photo img{position:relative;z-index:1;width:min(280px,64vw);height:auto;aspect-ratio:1;object-fit:cover;object-position:center 16%;border-radius:50%;border:6px solid var(--bg);box-shadow:var(--shadow)}
.hero-socials{display:flex;gap:12px;margin-top:30px}
.hero-socials a{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);color:var(--text-light);transition:.25s}
.hero-socials a:hover{transform:translateY(-4px);color:#fff;border-color:transparent}
.hero-socials a.wa:hover{background:#25d366}
.hero-socials a.fb:hover{background:#1877f2}
.hero-socials a.ig:hover{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.hero-socials svg{width:19px;height:19px}

/* Sections */
.sec-head{text-align:center;margin-bottom:54px}
.sec-head h2{font-size:clamp(1.6rem,3.5vw,2.3rem);font-weight:700;letter-spacing:-.02em}
.sec-head h2::after{content:"";display:block;width:0;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .8s cubic-bezier(.22,1,.36,1)}
.sec-head.visible h2::after{width:64px}
.sec-head p{color:var(--text-light);margin-top:10px}
.alt{background:var(--bg-alt);position:relative}
.alt::before{content:"";position:absolute;top:0;inset-inline-end:0;width:340px;height:340px;background:radial-gradient(circle at top right,rgba(37,99,235,.06),transparent 70%);pointer-events:none}

/* Services */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:34px 28px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s;position:relative;overflow:hidden;will-change:transform}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));opacity:0;transition:.3s}
.card:hover{transform:translateY(-8px);border-color:rgba(37,99,235,.35);box-shadow:0 22px 44px rgba(37,99,235,.14)}
.card:hover::before{opacity:1}
.card .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;margin-bottom:20px;background:linear-gradient(135deg,rgba(37,99,235,.14),rgba(6,182,212,.14));color:var(--primary)}
.card .ic svg{width:28px;height:28px}
.card h3{font-size:1.15rem;font-weight:600;margin-bottom:10px}
.card p{color:var(--text-light);font-size:.92rem;margin-bottom:14px}
.card ul{list-style:none}
.card li{color:var(--text-light);font-size:.88rem;padding:4px 0;display:flex;gap:8px;align-items:center}
.card li::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(90deg,var(--primary),var(--accent));flex-shrink:0}

/* Skills groups */
.skill-icons{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:980px;margin:0 auto 44px}
.sk{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 12px;text-align:center;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);transition:transform .3s,border-color .3s}
.sk:hover{border-color:var(--primary);box-shadow:0 14px 30px rgba(15,23,42,.14)}
.sk-ic{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 6px 16px rgba(37,99,235,.35)}
.sk-ic svg{width:26px;height:26px}
.sk:nth-child(2) .sk-ic{background:linear-gradient(135deg,var(--secondary),var(--accent))}
.sk:nth-child(3) .sk-ic{background:linear-gradient(135deg,var(--accent),var(--primary))}
.sk:nth-child(4) .sk-ic{background:linear-gradient(135deg,var(--primary),var(--accent))}
.sk:nth-child(5) .sk-ic{background:linear-gradient(135deg,var(--secondary),var(--primary))}
.skill-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.skill-group{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow)}
.skill-group h3{font-size:1.05rem;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.skill-group h3 svg{width:22px;height:22px;color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:9px 18px;border-radius:999px;background:var(--bg-alt);border:1px solid var(--border);font-size:.85rem;font-weight:500;transition:.25s}
[data-theme="dark"] .chip{background:var(--bg)}
.chip:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}

/* Timeline */
.timeline{position:relative;max-width:760px;margin:0 auto;padding-inline-start:34px}
.timeline::before{content:"";position:absolute;top:6px;bottom:6px;inset-inline-start:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--secondary),var(--accent))}
.t-item{position:relative;margin-bottom:34px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 26px;box-shadow:var(--shadow);transition:.3s}
.t-item:hover{transform:translateY(-4px)}
.t-item::before{content:"";position:absolute;inset-inline-start:-33px;top:28px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:4px solid var(--primary);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}70%{box-shadow:0 0 0 10px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.t-item .t-tag{display:inline-block;padding:4px 14px;border-radius:999px;background:linear-gradient(90deg,rgba(37,99,235,.12),rgba(6,182,212,.12));color:var(--primary);font-size:.78rem;font-weight:600;margin-bottom:8px}
.t-item h3{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.t-item p{color:var(--text-light);font-size:.9rem}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:stretch}
.contact-cards{display:grid;gap:18px;align-content:start}
.contact-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);transition:.3s}
.contact-card:hover{transform:translateY(-4px)}
.contact-card .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.contact-card .ic svg{width:24px;height:24px}
.contact-card.wa .ic{background:#25d366}
.contact-card.fb .ic{background:#1877f2}
.contact-card.ig .ic{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.contact-card.li .ic{background:#0a66c2}
.contact-card h3{font-size:1rem;font-weight:600}
.contact-card p{color:var(--text-light);font-size:.85rem}
.contact-card .go{margin-inline-start:auto;color:var(--primary);font-size:1.2rem}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.form-card h3{font-size:1.1rem;font-weight:600;margin-bottom:6px}
.form-card>p{color:var(--text-light);font-size:.88rem;margin-bottom:20px}
.form-card label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.form-card input,.form-card textarea{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font);font-size:.92rem;margin-bottom:16px;transition:border-color .2s;resize:vertical}
.form-card input:focus,.form-card textarea:focus{outline:none;border-color:var(--primary)}
.form-card .btn{width:100%;justify-content:center}

/* Footer */
footer{border-top:1px solid var(--border);padding:28px 0;text-align:center;color:var(--text-light);font-size:.88rem}
footer .f-links{display:flex;gap:22px;justify-content:center;margin-bottom:12px;list-style:none;flex-wrap:wrap}
footer .f-links a:hover{color:var(--primary)}

/* Back to top */
@media(max-width:640px){#toTop{width:40px;height:40px;bottom:14px;inset-inline-end:14px;border-radius:12px}
}
#toTop{position:fixed;bottom:24px;inset-inline-end:24px;width:46px;height:46px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.3s;z-index:90;box-shadow:0 8px 20px rgba(37,99,235,.4)}
#toTop.show{opacity:1;pointer-events:auto}
#toTop svg{width:20px;height:20px}

/* Reveal animation */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

/* RTL tweaks */
[dir="rtl"] .contact-card .go{transform:scaleX(-1)}

/* Responsive */
.gm-fav{display:none}

/* tech motion */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.35;animation:gridmove 16s linear infinite}
@keyframes gridmove{to{background-position:44px 44px}}
.term{margin-top:24px;max-width:430px;background:#0d1424;border:1px solid #1e2b4a;border-radius:14px;box-shadow:0 14px 34px rgba(15,23,42,.35);overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;direction:ltr;text-align:left}
.term-bar{display:flex;gap:6px;padding:9px 12px;background:#111c33;border-bottom:1px solid #1e2b4a}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#f87171}
.term-bar i:nth-child(2){background:#fbbf24}
.term-bar i:nth-child(3){background:#34d399}
.term-body{padding:14px 16px;color:#7dd3fc;min-height:112px;max-height:220px;overflow-y:auto;line-height:1.7}
.term-body .p{color:#c4b5fd}
.term-cursor{display:inline-block;width:8px;height:14px;background:#7dd3fc;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.term-input-row{display:none;align-items:center;gap:8px;margin-top:6px;color:#c4b5fd}
.term-input-row.on{display:flex}
.term-input-row input{flex:1;background:transparent;border:0;outline:0;color:#e2e8f0;font:inherit;font-family:ui-monospace,monospace;caret-color:#7dd3fc}
.term-input-row input::placeholder{color:#475569}
.term{cursor:text}
.stats-strip{padding:26px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 12px;text-align:center;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}
.stat:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(37,99,235,.15)}
.stat-num{display:block;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:13px;color:var(--text-light);margin-top:4px;display:block}
.code-window{background:#0f172a;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.35);max-width:720px;margin:0 auto}
.cw-bar{display:flex;gap:6px;align-items:center;padding:9px 12px;background:#111c33;border-bottom:1px solid #1e2b4a}
.cw-bar i{width:10px;height:10px;border-radius:50%;background:#f87171}
.cw-bar i:nth-child(2){background:#fbbf24}
.cw-bar i:nth-child(3){background:#34d399}
.cw-tab{margin-inline-start:10px;font-size:12px;color:#94a3b8;background:#1e293b;padding:3px 12px;border-radius:6px 6px 0 0;font-family:ui-monospace,monospace}
.cw-body{margin:0;padding:18px 20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.8;overflow-x:auto;color:#e2e8f0}
.cw-body .k{color:#c084fc}.cw-body .v{color:#7dd3fc}.cw-body .s{color:#86efac}.cw-body .n{color:#fbbf24}.cw-body .c{color:#475569;font-style:italic}.cw-body .p{color:#94a3b8}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.stat-num{font-size:26px}.cw-body{font-size:12px}}
.card::before,.sk::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(124,58,237,.14),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before,.sk:hover::before{opacity:1}
.sk{position:relative;overflow:hidden;animation:floaty 5s ease-in-out infinite}
.sk:nth-child(2){animation-delay:.6s}
.sk:nth-child(3){animation-delay:1.2s}
.sk:nth-child(4){animation-delay:1.8s}
.sk:nth-child(5){animation-delay:2.4s}
.sk-ic{animation:pulse 2.6s infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:640px){.term{max-width:100%}}
@media (prefers-reduced-motion:reduce){.sk,.sk-ic,body::before{animation:none!important}}
@media(max-width:960px){.skill-icons{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.skill-icons{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr;text-align:center;gap:40px}
  .hero p.bio{margin:0 auto 26px}
  .hero-cta,.hero-socials{justify-content:center}
  .hero-photo{order:-1}
  .cards,.skill-groups,.contact-grid{grid-template-columns:1fr}
  .nav-links{position:fixed;top:64px;inset-inline-end:0;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:0 0 0 16px;padding:20px 34px;gap:18px;transform:translateX(110%);transition:transform .3s;box-shadow:var(--shadow);z-index:99}
  [dir="rtl"] .nav-links{transform:translateX(-110%)}
  .nav-links.open{transform:none}
  .hamburger{display:grid}
  section{padding:70px 0}
}
.cf-status{margin:10px 0 0;font-size:14px;min-height:20px;color:var(--text-light)}
.cf-status.ok{color:#059669;font-weight:600}
.cf-status.err{color:#d97706}
</style>
</head>
