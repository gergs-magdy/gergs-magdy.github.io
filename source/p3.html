<script>
var CONTACT_WA = '201202463795';
var SUPA_URL = 'https://zimqgsyjmjruisymumxj.supabase.co/rest/v1/messages';
var SUPA_KEY = '__SUPA_ANON_KEY__';

// Theme
(function(){
  var saved = localStorage.getItem('gm-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');
  document.getElementById('themeToggle').addEventListener('click', function(){
    var d = document.documentElement;
    var next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    d.setAttribute('data-theme', next);
    localStorage.setItem('gm-theme', next);
  });
})();

// Language (EN/AR)
var LANG = localStorage.getItem('gm-lang') || (((navigator.language || 'en').slice(0,2)) === 'ar' ? 'ar' : 'en');
var ROLES = {
  en: ['IT Specialist','Graphic Designer','Data Entry Specialist','Web & App Developer'],
  ar: ['أخصائي تكنولوجيا معلومات','مصمم جرافيك','أخصائي إدخال بيانات','مطور مواقع وتطبيقات']
};
function applyLang(lang){
  LANG = lang;
  localStorage.setItem('gm-lang', lang);
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'ع';
  document.title = lang === 'ar'
    ? 'مهندس جرجس مجدي | أخصائي تكنولوجيا معلومات ومصمم جرافيك'
    : 'Eng. Gergs Magdy | IT Specialist & Graphic Designer';
  document.querySelectorAll('[data-en]').forEach(function(el){
    var v = el.getAttribute('data-' + lang);
    if (v !== null) el.innerHTML = v;
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    var v = el.getAttribute('data-' + lang + '-ph');
    if (v !== null) el.setAttribute('placeholder', v);
  });
  typeIdx = 0; typeChar = 0; typeDel = false;
}
document.getElementById('langToggle').addEventListener('click', function(){
  applyLang(LANG === 'ar' ? 'en' : 'ar');
});

// Typing effect
var typeIdx = 0, typeChar = 0, typeDel = false;
var typedEl = document.getElementById('typed');
(function tick(){
  var word = ROLES[LANG][typeIdx];
  typedEl.textContent = word.slice(0, typeChar);
  if (!typeDel) {
    typeChar++;
    if (typeChar > word.length) { typeDel = true; setTimeout(tick, 1600); return; }
  } else {
    typeChar--;
    if (typeChar === 0) { typeDel = false; typeIdx = (typeIdx + 1) % ROLES[LANG].length; }
  }
  setTimeout(tick, typeDel ? 40 : 85);
})();
applyLang(LANG);

// Mobile nav
(function(){
  var btn = document.getElementById('hamburger'), links = document.getElementById('navLinks');
  btn.addEventListener('click', function(){ links.classList.toggle('open'); });
  links.addEventListener('click', function(e){ if (e.target.tagName === 'A') links.classList.remove('open'); });
})();

// Scroll reveal
(function(){
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, {threshold:.12});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
})();

// Scroll progress + back to top + active nav
(function(){
  var bar = document.getElementById('progress'), top = document.getElementById('toTop');
  var secs = document.querySelectorAll('section[id]');
  var navAs = document.querySelectorAll('.nav-links a');
  window.addEventListener('scroll', function(){
    var h = document.documentElement;
    var p = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = p + '%';
    top.classList.toggle('show', h.scrollTop > 500);
    var cur = '';
    secs.forEach(function(s){ if (h.scrollTop >= s.offsetTop - 120) cur = s.id; });
    navAs.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href') === '#' + cur); });
  }, {passive:true});
  top.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
})();

// Contact form: save to database first, show confirmation, then open WhatsApp
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  var form = this;
  var name = document.getElementById('cf-name').value.trim();
  var msg = document.getElementById('cf-msg').value.trim();
  if (!name || !msg) return;
  var status = document.getElementById('cf-status');
  var btn = document.getElementById('cf-btn');
  btn.disabled = true;
  status.className = 'cf-status';
  status.textContent = LANG === 'ar' ? 'جاري الإرسال...' : 'Sending...';
  function openWA(){
    var text = (LANG === 'ar')
      ? 'مرحباً، أنا ' + name + '.\n' + msg
      : 'Hi, I am ' + name + '.\n' + msg;
    window.open('https://wa.me/' + CONTACT_WA + '?text=' + encodeURIComponent(text), '_blank');
  }
  fetch(SUPA_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Prefer': 'return=minimal'},
    body: JSON.stringify({name: name, message: msg})
  }).then(function(r){
    if (r.ok) {
      status.className = 'cf-status ok';
      status.textContent = LANG === 'ar' ? 'تم استلام رسالتك بنجاح! هرد عليك في أقرب وقت ✅' : 'Message received successfully! I will reply soon ✅';
      form.reset();
    } else {
      status.className = 'cf-status err';
      status.textContent = LANG === 'ar' ? 'حصلت مشكلة في الحفظ، بفتحلك واتساب تبعت منه مباشرة' : 'Could not save, opening WhatsApp so you can send directly';
    }
    openWA();
  }).catch(function(){
    status.className = 'cf-status err';
    status.textContent = LANG === 'ar' ? 'مفيش اتصال بالسيرفر، بفتحلك واتساب تبعت منه مباشرة' : 'No connection, opening WhatsApp so you can send directly';
    openWA();
  }).finally(function(){ btn.disabled = false; });
});

// Interactive particle background (hero) - lightweight, pauses off-screen
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('particles');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W, H, pts = [], mouse = {x:-9999, y:-9999}, running = false, raf;
  var N = window.innerWidth < 700 ? 40 : 80;
  function resize(){
    var r = cv.parentElement.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(){
    pts = [];
    for (var i = 0; i < N; i++) pts.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4
    });
  }
  function step(){
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var dot = dark ? 'rgba(147,167,255,' : 'rgba(37,99,235,';
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx*dx + dy*dy;
      if (d2 < 14400) { var f = 1.6 / Math.sqrt(d2 + 40); p.vx += dx * f * .02; p.vy += dy * f * .02; }
      p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, 6.283);
      ctx.fillStyle = dot + '.5)'; ctx.fill();
      for (var j = i + 1; j < pts.length; j++) {
        var q = pts[j], ax = p.x - q.x, ay = p.y - q.y, dd = ax*ax + ay*ay;
        if (dd < 12100) {
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = dot + (0.16 * (1 - dd / 12100)) + ')';
          ctx.lineWidth = 1; ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(step);
  }
  var hero = cv.parentElement;
  hero.addEventListener('pointermove', function(e){
    var r = cv.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
  });
  hero.addEventListener('pointerleave', function(){ mouse.x = -9999; mouse.y = -9999; });
  new IntersectionObserver(function(en){
    var vis = en[0].isIntersecting;
    if (vis && !running) { running = true; step(); }
    if (!vis && running) { running = false; cancelAnimationFrame(raf); }
  }).observe(cv);
  window.addEventListener('resize', function(){ resize(); init(); });
  resize(); init();
})();

// 3D tilt on hero photo (fine pointers only)
(function(){
  if (!window.matchMedia('(pointer: fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var photo = document.querySelector('.hero-photo');
  if (!photo) return;
  var ring = photo.querySelector('.ring');
  photo.addEventListener('mousemove', function(e){
    var r = photo.getBoundingClientRect();
    var rx = ((e.clientY - r.top) / r.height - .5) * -14;
    var ry = ((e.clientX - r.left) / r.width - .5) * 14;
    photo.style.transform = 'perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale(1.03)';
    if (ring) ring.style.animationPlayState = 'paused';
  });
  photo.addEventListener('mouseleave', function(){
    photo.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
    if (ring) ring.style.animationPlayState = '';
  });
})();

// Cursor-follow glow (desktop)
(function(){
  if (!window.matchMedia('(pointer: fine)').matches) return;
  var g = document.getElementById('glow');
  var tx = -999, ty = -999, x = -999, y = -999;
  document.addEventListener('pointermove', function(e){ tx = e.clientX; ty = e.clientY; });
  (function loop(){
    x += (tx - x) * .08; y += (ty - y) * .08;
    g.style.left = x + 'px'; g.style.top = y + 'px';
    requestAnimationFrame(loop);
  })();
})();

// Magnetic buttons (hero CTAs, desktop)
(function(){
  if (!window.matchMedia('(pointer: fine)').matches) return;
  document.querySelectorAll('.btn').forEach(function(btn){
    btn.addEventListener('mousemove', function(e){
      var r = btn.getBoundingClientRect();
      var dx = (e.clientX - r.left - r.width / 2) * .18;
      var dy = (e.clientY - r.top - r.height / 2) * .3;
      btn.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
    btn.addEventListener('mouseleave', function(){ btn.style.transform = ''; });
  });
})();

// Staggered reveal delays + card micro-tilt
(function(){
  document.querySelectorAll('.cards, .skill-groups, .contact-cards, .timeline').forEach(function(group){
    Array.prototype.forEach.call(group.querySelectorAll('.reveal'), function(el, i){
      el.style.transitionDelay = (i * 90) + 'ms';
    });
  });
  if (!window.matchMedia('(pointer: fine)').matches) return;
  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('mousemove', function(e){
      var r = card.getBoundingClientRect();
      var rx = ((e.clientY - r.top) / r.height - .5) * -4;
      var ry = ((e.clientX - r.left) / r.width - .5) * 4;
      card.style.transform = 'translateY(-8px) perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    });
    card.addEventListener('mouseleave', function(){ card.style.transform = ''; });
  });
})();

document.getElementById('year').textContent = new Date().getFullYear();


// Terminal typing card + interactive commands
var TERM_CMDS = {
  en: {
    help: ['Available commands:',
'  whoami      - who is Gergs',
'  skills      - list top skills',
'  services    - what I offer',
'  education   - my degree',
'  contact     - how to reach me',
'  clear       - clear the terminal'],
    whoami: ['> Eng. Gergs Magdy - IT Specialist & Graphic Designer'],
    skills: ['> IT Support - Graphic Design - Data Entry - Web & Apps - HTML/CSS/JS/Java'],
    services: ['> Tech Support - Web Development - Graphic Design - Data Entry - Office - Networks'],
    education: ['> B.Sc. IT & Education, Faculty of Specific Education, Zagazig University (2024)'],
    contact: ['> Use the Contact section below, or tap "WhatsApp Me" in the hero'],
    unknown: ['> command not found. Type "help" for the list.']
  },
  ar: {
    help: ['الأوامر المتاحة:',
'  whoami      - من هو جرجس',
'  skills      - أهم المهارات',
'  services    - الخدمات',
'  education   - المؤهل',
'  contact     - التواصل',
'  clear       - مسح الشاشة'],
    whoami: ['> م. جرجس مجدي - أخصائي تكنولوجيا معلومات ومصمم جرافيك'],
    skills: ['> دعم فني - تصميم جرافيك - إدخال بيانات - مواقع وتطبيقات - HTML/CSS/JS/Java'],
    services: ['> دعم فني - تطوير مواقع - تصميم جرافيك - إدخال بيانات - أوفيس - شبكات'],
    education: ['> بكالوريوس تكنولوجيا المعلومات والتعليم - جامعة الزقازيق (2024)'],
    contact: ['> استخدم قسم "تواصل معي" بالأسفل أو زر "WhatsApp Me" في الأعلى'],
    unknown: ['> أمر غير معروف. اكتب "help" لعرض القائمة.']
  }
};
(function(){
  var el = document.getElementById('termText');
  if (!el) return;
  var row = document.getElementById('termRow');
  var input = document.getElementById('termInput');
  var lines = [
    {t:'$ whoami', c:1},
    {t:'> Eng. Gergs Magdy'},
    {t:'$ skills --list', c:1},
    {t:'> IT Support - Graphic Design - Data Entry - Web & Apps'},
    {t:'$ status', c:1},
    {t:'> Available for new projects'},
    {t:'$ _', c:1}
  ];
  var li = 0, ci = 0, out = '';
  function done(){
    if (!row || !input) return;
    row.classList.add('on');
    document.getElementById('termBody').addEventListener('click', function(){ input.focus(); });
    input.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      var cmd = input.value.trim().toLowerCase();
      input.value = '';
      if (!cmd) return;
      if (cmd === 'clear'){ out = ''; el.innerHTML = ''; return; }
      var dict = TERM_CMDS[LANG] || TERM_CMDS.en;
      var resp = dict[cmd] || dict.unknown;
      out += '<span class="p">$ ' + cmd + '</span><br>';
      resp.forEach(function(l){ out += l + '<br>'; });
      el.innerHTML = out;
      var body = document.getElementById('termBody');
      body.scrollTop = body.scrollHeight;
    });
  }
  function tick(){
    if (li >= lines.length){ done(); return; }
    var L = lines[li];
    ci++;
    var part = L.t.slice(0, ci);
    el.innerHTML = out + (L.c ? '<span class="p">' + part + '</span>' : part);
    if (ci >= L.t.length){
      out += (L.c ? '<span class="p">' + L.t + '</span>' : L.t) + '<br>';
      li++; ci = 0;
      setTimeout(tick, 500);
    } else setTimeout(tick, 32);
  }
  tick();
})();

// Stats count-up
(function(){
  var nums = document.querySelectorAll('.stat-num');
  if (!nums.length) return;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function run(el){
    var target = +el.getAttribute('data-count'), suf = el.getAttribute('data-suffix') || '';
    if (reduced){ el.textContent = target + suf; return; }
    var start = Date.now();
    var iv = setInterval(function(){
      var p = Math.min((Date.now() - start) / 1400, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suf;
      if (p >= 1) clearInterval(iv);
    }, 40);
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){ run(en.target); io.unobserve(en.target); }
    });
  }, {threshold: .5});
  nums.forEach(function(n){ io.observe(n); });
})();

// Pointer-tracking glow on cards and skill tiles
document.querySelectorAll('.card,.sk').forEach(function(el){
  el.addEventListener('pointermove', function(e){
    var r = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    el.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
});
</script>
